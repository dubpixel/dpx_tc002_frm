name: WLED Release CI

on:
  push:
    tags:
      - '*'

permissions:
  contents: write # required by softprops/action-gh-release to create/update releases — the release job was failing with 403 without this

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  
  wled_build:
    uses: ./.github/workflows/build.yml
    with:
      release: true
    
  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: wled_build
    steps:
    - uses: actions/download-artifact@v4
      with:
        merge-multiple: true
    - name: Create draft release
      uses: softprops/action-gh-release@v1
      with:
        body: "Release assets uploaded. Release notes pending..."
        draft: True
        files: |
          *.bin
          *.bin.gz
    - name: "✏️ Generate release changelog"
      id: changelog
      uses: janheinrichmerker/action-github-changelog-generator@v2.4
      with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # sinceTag was hardcoded to v0.15.0, a tag from upstream WLED that
          # doesn't exist in this fork — the action errored on every single
          # release run ("can't find tag v0.15.0"). Omitted so it uses the
          # actual previous tag in this repo's own history instead.
          maxIssues: 500
          # Exclude issues that were closed without resolution from changelog
          excludeLabels: 'stale,wontfix,duplicate,invalid,external,question,use-as-is,not_planned'       
    - name: Update release description
      uses: softprops/action-gh-release@v1
      with:
        body: ${{ steps.changelog.outputs.changelog }}
        draft: True

