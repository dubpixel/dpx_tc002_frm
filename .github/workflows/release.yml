name: WLED Release CI

on:
  push:
    tags:
      - '*'

permissions:
  contents: write # required by softprops/action-gh-release to create/update releases — the release job was failing with 403 without this

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  
  wled_build:
    uses: ./.github/workflows/build.yml
    with:
      release: true
    
  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: wled_build
    steps:
    - uses: actions/checkout@v4
    - uses: actions/download-artifact@v4
      with:
        merge-multiple: true
    - name: Extract this version's CHANGELOG.md section
      id: notes
      # Previously this job ran the janheinrichmerker changelog-generator action
      # in a second step, updating the release AFTER the first draft-create
      # step. That second call created its own separate "untagged-<sha>"
      # release instead of updating the one just created (no explicit
      # tag_name — it apparently didn't reliably re-resolve the same tag),
      # AND generator dumped the project's ENTIRE historical changelog into
      # every release body, not just this version's notes. CHANGELOG.md is
      # already hand-maintained per-release (see update-docs skill), so pull
      # this tag's section straight from it instead — one atomic release
      # step, scoped notes, no second network call.
      run: |
        VERSION="${GITHUB_REF_NAME#v}"
        awk -v ver="$VERSION" '
          /^### \[/ {
            if (capture) exit
            if ($0 ~ ("\\[" ver "\\]")) { capture=1; next }
            next
          }
          capture && /^---$/ { exit }
          capture { print }
        ' CHANGELOG.md > release_notes.md
        if [ ! -s release_notes.md ]; then
          echo "_No CHANGELOG.md entry found for $VERSION._" > release_notes.md
        fi
    - name: Create release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: ${{ github.ref_name }}
        body_path: release_notes.md
        draft: true
        files: |
          *.bin
          *.bin.gz

