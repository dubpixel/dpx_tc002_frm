name: WLED Release CI

on:
  push:
    tags:
      - '*'

permissions:
  contents: write # required by softprops/action-gh-release to create/update releases — the release job was failing with 403 without this

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  
  wled_build:
    uses: ./.github/workflows/build.yml
    with:
      release: true
    
  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: wled_build
    steps:
    - uses: actions/checkout@v4
    - uses: actions/download-artifact@v4
      with:
        merge-multiple: true
    - name: Extract this version's CHANGELOG.md section
      id: notes
      # Previously this job ran the janheinrichmerker changelog-generator action
      # in a second step, updating the release AFTER the first draft-create
      # step. That second call created its own separate "untagged-<sha>"
      # release instead of updating the one just created (no explicit
      # tag_name — it apparently didn't reliably re-resolve the same tag),
      # AND generator dumped the project's ENTIRE historical changelog into
      # every release body, not just this version's notes. CHANGELOG.md is
      # already hand-maintained per-release (see update-docs skill), so pull
      # this tag's section straight from it instead — one atomic release
      # step, scoped notes, no second network call.
      run: |
        # Strip whichever tag prefix is present: new tags are dpx-vX.Y.Z (see
        # AGENTS.md "Tag naming"), old ones (pre-dpx-v0.6.0) were bare vX.Y.Z.
        VERSION="${GITHUB_REF_NAME#dpx-v}"
        VERSION="${VERSION#v}"
        awk -v ver="$VERSION" '
          /^### \[/ {
            if (capture) exit
            if ($0 ~ ("\\[" ver "\\]")) { capture=1; next }
            next
          }
          capture && /^---$/ { exit }
          capture { print }
        ' CHANGELOG.md > release_notes.md
        if [ ! -s release_notes.md ]; then
          echo "_No CHANGELOG.md entry found for $VERSION._" > release_notes.md
        fi
    - name: Create release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: ${{ github.ref_name }}
        body_path: release_notes.md
        draft: true
        files: |
          *.bin
          *.bin.gz

    - name: Also promote this build to the Nightly release
      # dpx-v* tags are always cut directly from main's tip (this project's
      # actual tagging workflow) -- so this build IS what nightly.yml would
      # otherwise rebuild from scratch at its next 2 AM UTC run anyway.
      # Reuse the artifacts already downloaded above instead of burning CI
      # minutes (and cache) on a redundant identical build. nightly.yml's own
      # schedule keeps running independently, so a day with no release still
      # gets a fresh nightly build as normal -- this just keeps nightly from
      # sitting stale in between releases. Published immediately (not a
      # draft), matching nightly.yml's own always-live behavior; the
      # versioned release above stays a draft pending manual review either way.
      uses: softprops/action-gh-release@v1
      with:
        tag_name: nightly
        name: "Nightly Release (from ${{ github.ref_name }})"
        prerelease: true
        body: "Same build as [${{ github.ref_name }}](https://github.com/${{ github.repository }}/releases/tag/${{ github.ref_name }}) — see its release notes for details."
        files: |
          *.bin
          *.bin.gz

