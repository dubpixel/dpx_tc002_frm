name: Web Flash Deploy

# Rebuilds the Ulanzi TC001 (dpx_tc002) firmware and republishes the
# GitHub Pages site (site/) — a project landing page at the root
# (site/index.html) plus the browser-flash install page at /flash/
# (site/flash/index.html, GH #77 moved it out of the root so first-
# time visitors land on project info, not straight into "flash a device").
# The flash page uses ESP Web Tools (esphome/esp-web-tools), same mechanism
# install.wled.me uses. Desktop Chrome/Edge only (Web Serial).
#
# Two channels, published side by side (neither overwrites the other):
#   nightly  — rebuilt on every push to main that touches firmware code.
#              Tracks main HEAD directly, always latest/bleeding-edge.
#   release  — rebuilt only on a tag push (a real version bump). Stable,
#              pinned to whatever commit the tag points at.
# GitHub Pages deploys the whole site fresh each run, so each run only
# rebuilds the channel matching its own trigger, then re-fetches the OTHER
# channel's currently-live files from the site itself so they survive
# untouched in this deploy.

on:
  push:
    branches: [main]
    paths:
      - 'usermods/**'
      - 'wled00/**'
      - 'pio-scripts/**'
      - 'platformio.ini'
      - 'platformio_override.ini'
      - 'site/**'
      - '.github/workflows/web-flash-deploy.yml'
    tags:
      - '*'
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build_and_deploy:
    name: Build firmware + deploy install page
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install PlatformIO
        run: pip install -r requirements.txt

      - name: Build ulanzi_tc001
        run: pio run -e ulanzi_tc001

      - name: Verify web-flash artifacts were produced
        run: |
          test -f build_output/release/manifest.json || { echo "manifest.json missing — dpx_web_flash_bins.py didn't run or failed"; exit 1; }
          test -n "$(ls build_output/release/dpx_tc002_*_TC001*.bin 2>/dev/null)" || { echo "no TC001 .bin files found"; exit 1; }

      - name: Determine channel
        id: channel
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "name=release" >> "$GITHUB_OUTPUT"
            echo "other=nightly" >> "$GITHUB_OUTPUT"
          else
            echo "name=nightly" >> "$GITHUB_OUTPUT"
            echo "other=release" >> "$GITHUB_OUTPUT"
          fi

      - name: Stage this run's channel
        run: |
          CH="${{ steps.channel.outputs.name }}"
          mkdir -p "site/firmware/$CH"
          cp build_output/release/manifest.json "site/firmware/$CH/"
          cp build_output/release/dpx_tc002_*_TC001*.bin "site/firmware/$CH/"
          echo "Staged $CH channel:"
          ls -la "site/firmware/$CH/"

      - name: Build API docs page
        run: node tools/build_pages_api_docs.js

      - name: Preserve the other channel's currently-live files
        run: |
          OTHER="${{ steps.channel.outputs.other }}"
          BASE="https://dubpixel.github.io/dpx_tc002_frm/firmware/$OTHER"
          mkdir -p "site/firmware/$OTHER"
          if curl -sf "$BASE/manifest.json" -o "site/firmware/$OTHER/manifest.json"; then
            python3 -c "
          import json
          d = json.load(open('site/firmware/$OTHER/manifest.json'))
          for p in d['builds'][0]['parts']:
              print(p['path'])
          " | while read -r f; do
              curl -sf "$BASE/$f" -o "site/firmware/$OTHER/$f" || echo "warning: failed to fetch $f, $OTHER channel may be incomplete this deploy"
            done
            echo "Preserved $OTHER channel:"
            ls -la "site/firmware/$OTHER/"
          else
            echo "No live $OTHER channel yet (expected on the very first release build before any tag existed) — skipping preservation, that channel just won't be selectable until it's built once."
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
