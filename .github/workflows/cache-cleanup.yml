name: Cache Cleanup

# GitHub Actions cache doesn't reliably self-prune fast enough for this repo's
# CI pattern: every build.yml/usermods.yml run creates its own per-environment
# pio-Linux-* cache entry, keyed (in part) on file hashes, so a burst of
# version-bump commits or tagged releases creates a fresh cache entry each
# time instead of reusing an old one. Confirmed live twice now (once mid-
# session, once here): usage climbed past 12GB in a single day of active
# work. These are pure build-speed caches -- losing them just costs one
# slower rebuild next time, nothing is lost. Run daily rather than reacting
# to it manually every time it happens again -- weekly wasn't tight enough:
# usage climbed past 12GB in a single day of active work.
on:
  schedule:
    - cron: '0 3 * * *' # daily, 3 AM UTC (an hour after nightly.yml's 2 AM build)
  workflow_dispatch:

permissions:
  actions: write

jobs:
  prune:
    name: Delete all Actions caches
    runs-on: ubuntu-latest
    steps:
    - name: Delete all caches for this repo
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: gh cache delete --all --succeed-on-no-caches --repo ${{ github.repository }}
