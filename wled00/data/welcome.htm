<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta content='width=device-width' name='viewport'>
		<meta name="theme-color" content="#14121a">
		<title>Set up your device</title>
		<style>
			:root { --purple: #b76ce7; }
			body {
				font-family: -apple-system, BlinkMacSystemFont, Verdana, Helvetica, sans-serif;
				text-align: center;
				background-color: #14121a;
				margin: 0;
				padding: 6vh 1.2rem 2rem;
				color: #eee9f5;
			}
			h1 { font-size: 1.5rem; margin: 0.6em 0 0.2em; }
			h1 span { color: var(--purple); }
			p.lede { color: #a89fbc; margin: 0 0 1.5em; line-height: 1.5; }
			#dpxName {
				display: inline-block;
				font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
				background: rgba(183, 108, 231, 0.1);
				border: 1px solid rgba(183, 108, 231, 0.3);
				border-radius: 8px;
				padding: 0.5em 0.9em;
				margin: 0 0 1.5em;
				font-size: 0.95em;
				color: #eee9f5;
			}
			button.primary {
				outline: none;
				cursor: pointer;
				padding: 0.9em 1.4em;
				width: 260px;
				max-width: 90%;
				text-transform: uppercase;
				font-size: 1rem;
				font-weight: 600;
				background-color: var(--purple);
				color: #1a1421;
				border: 0;
				border-radius: 25px;
				box-shadow: 0 4px 18px rgba(183, 108, 231, 0.35);
			}
			.skip {
				margin-top: 2.2em;
				font-size: 0.8rem;
			}
			.skip a { color: #766c88; text-decoration: underline; }
			#dpxVer {
				font-size: 0.75rem;
				color: #6a6178;
				margin: -0.8em 0 1.6em;
			}
		</style>
	</head>
	<body>
		<h1>Connect your <span>dpx_tc002</span> to WiFi</h1>
		<p id="dpxName">Loading device name…</p>
		<p id="dpxVer"></p>
		<p class="lede">One step left: give it your WiFi network so it can<br>reach <b>matrix_blaster</b> and stay connected on your network.</p>
		<button class="primary" onclick="window.location.href='./settings/wifi'">Set up WiFi →</button>
		<p class="skip"><a href="./?sliders">Skip — control it in AP mode instead</a></p>
		<script>
			// Show this device's actual mDNS/AP name (mac-suffixed, not a fixed
			// string) so there's no ambiguity about which device this is, whether
			// you're still on its AP or already joined WiFi. Also show the
			// running firmware version (WLED's own /json/info "ver" field,
			// which set_metadata.py already sources from package.json) so
			// there's no ambiguity about whether a flash actually took.
			fetch('/json/info').then(function(r){return r.json();}).then(function(info){
				if (!info.mac) { document.getElementById('dpxName').remove(); return; }
				var suffix = String(info.mac).replace(/:/g,'').toLowerCase().slice(-6);
				var name = 'dpx-tc002-' + suffix;
				document.getElementById('dpxName').textContent =
					name + '  ·  reachable at http://' + name + '.local once on your WiFi';
				if (info.ver) document.getElementById('dpxVer').textContent = 'firmware v' + info.ver;
			}).catch(function(){ document.getElementById('dpxName').remove(); });
		</script>
	</body>
</html>
