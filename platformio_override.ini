; ================================================================================
; platformio_override.ini — dpx_tc002 / Ulanzi TC001 Build Config
; ================================================================================
; Ulanzi TC001 hardware:
;   ESP32-WROOM-32D · 240MHz · 4MB flash · CH340 USB-serial
;   LED matrix: GPIO32, 256× WS2812B, 32×8 rows, row-major
;   LDR: GPIO35   I²C: GPIO21/22   Buttons: GPIO26/27/14
;
; Usage:
;   pio run -e ulanzi_tc001          # build + flash via USB
;   pio run -e ulanzi_tc001_ota      # build + flash via WiFi OTA
; ================================================================================

[platformio]
default_envs = ulanzi_tc001

; ── Shared hardware + build flags ─────────────────────────────────────────────
[dpx_tc001_common]
board                  = esp32dev
board_build.mcu        = esp32
board_build.f_cpu      = 240000000L
custom_usermods        = dpx_matrix
build_flags =
  ${env:esp32dev.build_flags}
  -D WLED_DISABLE_ALEXA
  -D WLED_DISABLE_LOXONE
  -D WLED_DISABLE_INFRARED
  -D WLED_DISABLE_HUESYNC
  -D WLED_DISABLE_ADALIGHT
  -D WLED_DISABLE_ESPNOW
  -D LEDPIN=32
  -D DEFAULT_LED_COUNT=256
  -D BTNPIN=26
  -D RLYPIN=-1
  -D IRPIN=-1
  -D STATUSPIN=-1
  -D DPX_BTN_LEFT=26
  -D DPX_BTN_MID=14
  -D DPX_BTN_RIGHT=27
  -D WLED_USE_LITTLEFS
  -D WLED_NTP_ENABLED=true
  -D WLED_PRODUCT_NAME='"dpx_tc002"'
  -D WLED_INSTANCE_NAME='"dpx_tc002"'
  -D WLED_RELEASE_NAME='"TC001"'
  -D WLED_ENABLE_AOTA
monitor_speed          = 115200
monitor_filters        = esp32_exception_decoder

; ── USB flash ─────────────────────────────────────────────────────────────────
[env:ulanzi_tc001]
extends            = env:esp32dev
board              = ${dpx_tc001_common.board}
board_build.mcu    = ${dpx_tc001_common.board_build.mcu}
board_build.f_cpu  = ${dpx_tc001_common.board_build.f_cpu}
custom_usermods    = ${dpx_tc001_common.custom_usermods}
build_flags        = ${dpx_tc001_common.build_flags}
monitor_speed      = ${dpx_tc001_common.monitor_speed}
monitor_filters    = ${dpx_tc001_common.monitor_filters}
upload_speed       = 460800
upload_protocol    = espota
upload_port        = 192.168.1.144  ; exchange for YOUR device's IP (find via router DHCP list or the device's serial boot log)
extra_scripts      = ${env.extra_scripts}
                     pre:pio-scripts/write_build_ts.py
                     post:pio-scripts/dpx_web_flash_bins.py

; ── Real USB serial flash ───────────────────────────────────────────────────────
; GH #68 — none of the other envs here actually do a serial upload (all
; espota/OTA); this is the genuine one, needed for a blank device's first
; flash or whenever OTA isn't available. Leaves upload_port unset so
; PlatformIO auto-detects the CH340 (VID:PID 1A86:7523) — override with
; `--upload-port /dev/cu.usbserial-XXXX` (find via `pio device list`) if
; auto-detect picks the wrong port on a machine with multiple serial devices.
[env:ulanzi_tc001_serial]
extends            = env:esp32dev
board              = ${dpx_tc001_common.board}
board_build.mcu    = ${dpx_tc001_common.board_build.mcu}
board_build.f_cpu  = ${dpx_tc001_common.board_build.f_cpu}
custom_usermods    = ${dpx_tc001_common.custom_usermods}
build_flags        = ${dpx_tc001_common.build_flags}
monitor_speed      = ${dpx_tc001_common.monitor_speed}
monitor_filters    = ${dpx_tc001_common.monitor_filters}
; 115200 is upstream WLED's own base default (platformio.ini), documented
; there as "slow upload speed but most compatible." Confirmed on hardware:
; 460800 failed twice in a row against this device/cable (esptool lost SPI
; comms to the flash chip mid-write — FlashID=0xffffff, "Packet content
; transfer stopped"); 115200 succeeded immediately after. Bump this only if
; you've verified a faster speed actually works on your own cable/adapter.
upload_speed       = 115200
extra_scripts      = ${env.extra_scripts}
                     pre:pio-scripts/write_build_ts.py
                     post:pio-scripts/dpx_web_flash_bins.py

; ── OTA / WiFi flash ──────────────────────────────────────────────────────────
; HTTP OTA via WLED's built-in /update endpoint — works without ArduinoOTA.
; Uses curl to POST the compiled binary. No serial cable needed.
[env:ulanzi_tc001_webota]
extends            = env:esp32dev
board              = ${dpx_tc001_common.board}
board_build.mcu    = ${dpx_tc001_common.board_build.mcu}
board_build.f_cpu  = ${dpx_tc001_common.board_build.f_cpu}
custom_usermods    = ${dpx_tc001_common.custom_usermods}
build_flags        = ${dpx_tc001_common.build_flags}
monitor_speed      = ${dpx_tc001_common.monitor_speed}
monitor_filters    = ${dpx_tc001_common.monitor_filters}
upload_protocol    = custom
upload_command     = curl -s -F "file=@$SOURCE" http://192.168.1.144/update && echo "OTA OK"  ; exchange for YOUR device's IP
extra_scripts      = ${env.extra_scripts}
                     pre:pio-scripts/write_build_ts.py

; ── ArduinoOTA / espota ───────────────────────────────────────────────────────
; Requires WLED_ENABLE_AOTA in build flags (already set). Use after first flash.
[env:ulanzi_tc001_ota]
extends            = env:esp32dev
board              = ${dpx_tc001_common.board}
board_build.mcu    = ${dpx_tc001_common.board_build.mcu}
board_build.f_cpu  = ${dpx_tc001_common.board_build.f_cpu}
custom_usermods    = ${dpx_tc001_common.custom_usermods}
build_flags        = ${dpx_tc001_common.build_flags}
monitor_speed      = ${dpx_tc001_common.monitor_speed}
monitor_filters    = ${dpx_tc001_common.monitor_filters}
upload_protocol    = espota
upload_port        = 192.168.1.144  ; exchange for YOUR device's IP
extra_scripts      = ${env.extra_scripts}
                     pre:pio-scripts/write_build_ts.py
; upload_flags     = --auth=wledota
